name: Bug report
description: Help improve the FrameSwift preview
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Please do not include passwords, tokens, or private photos."
  - type: input
    id: version
    attributes:
      label: FrameSwift version
      placeholder: 1.1.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: What happened, and how can we reproduce it?
      description: Include the expected result and the result you saw.
    validations:
      required: true
